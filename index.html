<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6ECE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Homebase">
<title>Homebase</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  --tile: #E6ECE8;      /* page, like bathroom tile */
  --grout: #C9D4CE;     /* lines and empty tiles */
  --paper: #F8FBF9;     /* surfaces */
  --ink: #17302E;
  --muted: #5D6F6B;
  --a: #1D7385;         /* person A, disinfecting */
  --a-soft: #CFE6EA;
  --b: #A86A12;         /* person B, organising */
  --b-soft: #F1E1C4;
  --warn: #B23A2E;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --tile: #121C1B; --grout: #2B3B39; --paper: #1A2726; --ink: #E3ECE9; --muted: #9AACA8;
    --a: #5FB7C8; --a-soft: #1E3F46; --b: #E0A54A; --b-soft: #45361C; --warn: #F07A6C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--tile); color: var(--ink); font: 17px/1.45 var(--body);
  -webkit-text-size-adjust: 100%;
  padding: env(safe-area-inset-top, 0) 0 calc(72px + env(safe-area-inset-bottom, 0));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--a); outline-offset: 2px; }

header.top {
  display: flex; align-items: center; gap: 12px;
  max-width: 720px; margin: 0 auto; padding: 18px 18px 6px;
}
header.top h1 { font: 700 26px/1.1 var(--display); margin: 0; flex: 1; letter-spacing: -0.01em; }
.sync-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--grout); border: 0; padding: 0; }
.sync-dot[data-s="ok"] { background: #3E9A5B; }
.sync-dot[data-s="syncing"] { background: var(--b); }
.sync-dot[data-s="error"] { background: var(--warn); }

main { max-width: 720px; margin: 0 auto; padding: 6px 14px 24px; }
h2 { font: 700 21px/1.2 var(--display); margin: 18px 4px 10px; }
h3 { font: 700 18px/1.2 var(--display); margin: 0; }
p.lede { color: var(--muted); margin: 0 4px 14px; }

/* Person panels */
.person { background: var(--paper); border-radius: 14px; padding: 14px 14px 6px; margin-bottom: 14px; border-top: 5px solid var(--who); }
.person[data-p="A"] { --who: var(--a); --who-soft: var(--a-soft); }
.person[data-p="B"] { --who: var(--b); --who-soft: var(--b-soft); }
.person-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.person-head .lean { color: var(--muted); font-size: 15px; }
.person-head .you { font-size: 13px; background: var(--who); color: var(--paper); border-radius: 99px; padding: 1px 9px; }

/* The day as six 5-minute tiles: tinted = planned, solid = done */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin: 10px 0 4px; }
.tiles span { height: 14px; border-radius: 3px; background: var(--grout); opacity: .55; }
.tiles span.plan { background: var(--who-soft); opacity: 1; }
.tiles span.done { background: var(--who); opacity: 1; }
.tiles span.over { background: var(--warn); opacity: 1; }
.tile-label { font-size: 14px; color: var(--muted); margin-bottom: 6px; }

/* Task rows */
ul.tasks { list-style: none; margin: 0; padding: 0; }
li.task { display: flex; gap: 12px; padding: 11px 0; border-top: 1px solid var(--grout); align-items: flex-start; }
li.task:first-child { border-top: 0; }
.check {
  flex: none; width: 34px; height: 34px; border-radius: 9px; border: 2px solid var(--who, var(--muted));
  background: transparent; display: grid; place-items: center; color: transparent; font-size: 19px; font-weight: 700;
}
li.task.done .check { background: var(--who, var(--muted)); color: var(--paper); }
li.task.done .t-name { text-decoration: line-through; color: var(--muted); }
.t-body { flex: 1; min-width: 0; }
.t-name { font-weight: 700; }
.t-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 14px; color: var(--muted); margin-top: 2px; align-items: center; }
.tag { border-radius: 6px; padding: 0 7px; font-size: 13px; }
.tag.disinfect { background: var(--a-soft); color: var(--a); }
.tag.organise { background: var(--b-soft); color: var(--b); }
.tag.neutral { background: var(--grout); color: var(--ink); }
.tag.heavy { border: 1px dashed currentColor; }
details.how { margin-top: 4px; font-size: 15px; }
details.how summary { color: var(--who, var(--a)); cursor: pointer; }
details.how p { margin: 6px 0 0; }
.empty { color: var(--muted); padding: 8px 0 12px; }

/* Week view */
.week-nav { display: flex; align-items: center; gap: 8px; margin: 10px 4px 12px; }
.week-nav .label { flex: 1; text-align: center; font: 700 18px var(--display); }
.icon-btn { border: 1px solid var(--grout); background: var(--paper); border-radius: 10px; min-width: 44px; height: 44px; padding: 0 12px; }
.summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.summary .person { margin: 0; padding-bottom: 12px; }
.bar { height: 10px; background: var(--grout); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--who); }
.day { background: var(--paper); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day-head { display: flex; justify-content: space-between; align-items: baseline; }
.day-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 6px; }
.day-cols .col[data-p="A"] { --who: var(--a); --who-soft: var(--a-soft); }
.day-cols .col[data-p="B"] { --who: var(--b); --who-soft: var(--b-soft); }
.col-head { font-size: 14px; color: var(--who); font-weight: 700; display: flex; justify-content: space-between; }
.col-head .over { color: var(--warn); }
.day-cols li.task { padding: 7px 0; gap: 8px; }
.day-cols .check { width: 26px; height: 26px; border-radius: 7px; font-size: 15px; }
.day-cols .t-name { font-weight: 400; font-size: 15px; line-height: 1.3; }
@media (max-width: 420px) { .day-cols { grid-template-columns: 1fr; gap: 4px; } }

/* Chore list */
.chore-row {
  width: 100%; text-align: left; background: var(--paper); border: 0; border-radius: 12px;
  padding: 12px 14px; margin-bottom: 6px; display: block;
}
.chore-row .t-meta { margin-top: 4px; }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; background: var(--ink); color: var(--paper); font-weight: 700; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--grout); }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Forms */
.card { background: var(--paper); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
label.f { display: block; margin-bottom: 12px; font-size: 15px; color: var(--muted); }
label.f > input, label.f > select, label.f > textarea {
  display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--grout); background: var(--tile); color: var(--ink); font-size: 17px;
}
label.f > textarea { min-height: 90px; resize: vertical; }
label.inline { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
label.inline input { width: 22px; height: 22px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-size: 14px; color: var(--muted); margin: -4px 0 12px; }
.status-line { font-size: 15px; margin: 8px 0 0; }
.status-line.error { color: var(--warn); }

.banner { background: var(--paper); border-radius: 14px; padding: 14px; margin-bottom: 14px; border: 2px dashed var(--grout); }

.t-name.link { display: block; background: none; border: 0; padding: 0; text-align: left; font: inherit; font-weight: 700; color: inherit; }
.day-cols .t-name.link { font-weight: 400; font-size: 15px; line-height: 1.3; }
li.task.done .t-name.link { text-decoration: line-through; color: var(--muted); }
.mini { background: none; border: 1px solid var(--grout); border-radius: 6px; padding: 0 8px; font-size: 13px; color: var(--muted); }
.credit { font-weight: 700; }
.credit[data-p="A"] { color: var(--a); }
.credit[data-p="B"] { color: var(--b); }
.moved { font-style: italic; }
.who { background: var(--paper); border: 1px solid var(--grout); border-radius: 99px; padding: 6px 12px; font-size: 14px; }
.who[data-p="A"] { border-color: var(--a); color: var(--a); }
.who[data-p="B"] { border-color: var(--b); color: var(--b); }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(560px, 94vw); background: var(--paper); color: var(--ink); }
dialog::backdrop { background: rgba(10, 20, 20, .45); }
dialog .card { margin: 0; max-height: 86vh; overflow-y: auto; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--paper);
  border-top: 1px solid var(--grout); padding-bottom: env(safe-area-inset-bottom, 0);
}
nav.tabs button { flex: 1; background: none; border: 0; padding: 10px 4px 12px; font-size: 15px; color: var(--muted); }
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; box-shadow: inset 0 3px 0 var(--ink); }
@media (prefers-reduced-motion: no-preference) {
  .check { transition: background-color .15s, color .15s; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Homebase</h1>
  <button class="who" id="whoBtn" hidden></button>
  <button class="sync-dot" id="syncDot" data-s="off" title="Sync is off" aria-label="Sync status"></button>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today">Today</button>
  <button data-tab="week">Week</button>
  <button data-tab="chores">Chores</button>
  <button data-tab="settings">Settings</button>
</nav>

<dialog id="taskDlg" aria-labelledby="taskTitle">
  <div class="card">
    <h2 id="taskTitle" style="margin-top:0">Task</h2>
    <p class="hint" id="t-info" style="margin:0 0 14px"></p>
    <div class="two">
      <label class="f">Assigned to<select id="t-person"></select></label>
      <label class="f">Day<select id="t-day"></select></label>
    </div>
    <label class="f">Done?<select id="t-done"></select></label>
    <p class="hint">This changes this one task only. To change it every week, edit the chore in the Chores tab.</p>
    <div class="row">
      <button class="btn" id="t-save">Save</button>
      <button class="btn ghost" id="t-cancel">Cancel</button>
      <span style="flex:1"></span>
      <button class="btn ghost" id="t-reset">Back to rota</button>
    </div>
  </div>
</dialog>

<dialog id="editDlg" aria-labelledby="editTitle">
  <div class="card">
    <h2 id="editTitle" style="margin-top:0">Edit chore</h2>
    <label class="f">Chore<input id="f-name" maxlength="80" required></label>
    <div class="two">
      <label class="f">Minutes<input id="f-minutes" type="number" min="5" max="30" step="5" inputmode="numeric"></label>
      <label class="f">How often<select id="f-freq">
        <option value="daily">Every day</option>
        <option value="weekly">Weekly</option>
        <option value="fortnightly">Fortnightly</option>
        <option value="monthly">Every 4 weeks</option>
      </select></label>
    </div>
    <div class="two">
      <label class="f">Type<select id="f-cat">
        <option value="disinfect">Disinfecting</option>
        <option value="organise">Organising</option>
        <option value="neutral">General</option>
      </select></label>
      <label class="f">Who<select id="f-owner">
        <option value="">On the rota</option>
        <option value="A">Always A</option>
        <option value="B">Always B</option>
      </select></label>
    </div>
    <div class="two">
      <label class="f">Day<select id="f-day">
        <option value="-1">Any day</option>
        <option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option>
        <option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option>
      </select></label>
      <label class="f" id="f-offset-wrap">Which week<select id="f-offset"></select></label>
    </div>
    <label class="inline"><input type="checkbox" id="f-heavy"> Daunting chore: strictly take turns</label>
    <label class="f">How to (optional)<textarea id="f-notes" maxlength="600"></textarea></label>
    <div class="row">
      <button class="btn" id="f-save">Save chore</button>
      <button class="btn ghost" id="f-cancel">Cancel</button>
      <span style="flex:1"></span>
      <button class="btn danger" id="f-delete">Delete</button>
    </div>
  </div>
</dialog>

<script src="rota.js"></script>
<script src="config.js"></script><!-- optional: created in Settings → Logins -->
<script src="app.js"></script>
</body>
</html>
